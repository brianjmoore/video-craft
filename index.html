<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1014">
<title>Video Craft</title>
<style>
  :root { --bg:#0f1014; --panel:rgba(22,24,30,.92); --fg:#e6e8ee; --dim:#9aa0ad; --acc:#ffbf3c; --line:#2c303a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  button,.btn { font:inherit; color:var(--fg); background:#262a33; border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; min-height:38px; cursor:pointer; user-select:none; -webkit-user-select:none; }
  button:active,.btn:active { background:#323743; }
  button.primary { background:var(--acc); color:#1a1405; border-color:var(--acc); font-weight:600; }
  button.on { background:var(--acc); color:#1a1405; border-color:var(--acc); }
  button:disabled { opacity:.45; }
  .preview-only, .game-only { display:none !important; }
  body.preview .preview-only { display:flex !important; }
  body.game .game-only { display:block !important; }
  #top { position:fixed; z-index:2; top:0; left:0; right:0; gap:6px; flex-wrap:wrap; align-items:center;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px; pointer-events:none; }
  #top > * { pointer-events:auto; }
  #top .spacer { flex:1; pointer-events:none; }
  #status { position:fixed; left:10px; top:calc(env(safe-area-inset-top) + 56px); color:var(--dim); font-size:12px;
    pointer-events:none; text-shadow:0 1px 2px #000; max-width:70vw; }
  #panel { position:fixed; left:0; right:0; bottom:0; max-height:48vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel); border-top:1px solid var(--line); padding:6px 12px calc(env(safe-area-inset-bottom) + 12px);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:transform .2s; flex-direction:column; }
  #panel.hidden { transform:translateY(100%); }
  @media (min-width:820px) and (orientation:landscape) {
    #panel { left:auto; top:0; width:340px; max-height:none; border-top:none; border-left:1px solid var(--line);
      padding-top:calc(env(safe-area-inset-top) + 56px); }
    #panel.hidden { transform:translateX(100%); }
  }
  section { padding:8px 0; border-bottom:1px solid var(--line); }
  section:last-child { border-bottom:none; }
  h3 { margin:4px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .ctl { display:grid; grid-template-columns:92px 1fr 58px; align-items:center; gap:8px; margin:4px 0; }
  .ctl label { color:var(--dim); font-size:13px; }
  .ctl output { text-align:right; font-variant-numeric:tabular-nums; font-size:12px; color:var(--fg); }
  input[type=range] { width:100%; height:30px; margin:0; accent-color:var(--acc); }
  .seg { display:flex; margin:6px 0; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; border:none; border-radius:0; background:transparent; padding:7px 4px; min-height:34px; font-size:13px; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--acc); color:#1a1405; font-weight:600; }
  .segLabel { color:var(--dim); font-size:12px; margin-top:6px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  .row button { flex:1; }
  .note { color:var(--dim); font-size:12px; }
  video#vid { width:100%; max-height:28vh; background:#000; border-radius:6px; }
  #mem.warn { color:#ff7a6b; }
  progress { width:100%; height:8px; accent-color:var(--acc); }
  #sliceThumb { width:100%; image-rendering:pixelated; border-radius:4px; background:#000; display:block; }
  #hint { position:fixed; left:50%; top:45%; transform:translate(-50%,-50%); color:var(--dim); text-align:center; pointer-events:none; }

  /* game HUD */
  #hud { position:fixed; left:10px; top:calc(env(safe-area-inset-top) + 10px); pointer-events:none; text-shadow:0 1px 2px #000;
    font-size:13px; max-width:60vw; }
  #hudThumb { width:160px; image-rendering:pixelated; border:1px solid rgba(255,255,255,.35); border-radius:4px; display:block; margin-bottom:4px; }
  #hud .big { font-weight:600; font-variant-numeric:tabular-nums; }
  #sense { margin-top:4px; }
  #senseBar { width:160px; height:5px; background:rgba(255,255,255,.15); border-radius:3px; margin-top:3px; overflow:hidden; }
  #senseBar div { height:100%; width:0; background:linear-gradient(90deg,#4cc9f0,#ffbf3c,#ff5d5d); }
  #cross { position:fixed; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; pointer-events:none; }
  #cross::before,#cross::after { content:""; position:absolute; background:#fff; mix-blend-mode:difference; }
  #cross::before { left:8px; top:0; width:2px; height:18px; }
  #cross::after { top:8px; left:0; height:2px; width:18px; }
  #help { position:fixed; left:10px; right:70px; bottom:calc(env(safe-area-inset-bottom) + 10px); color:var(--dim); font-size:12px;
    pointer-events:none; text-shadow:0 1px 2px #000; }
  #swatch { position:fixed; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); width:44px; height:44px;
    border:2px solid #fff; border-radius:6px; pointer-events:none; box-shadow:0 2px 6px #000; }
  #toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 14px); transform:translateX(-50%);
    background:rgba(20,22,28,.9); border:1px solid var(--acc); border-radius:10px; padding:10px 16px; text-align:center;
    pointer-events:none; opacity:0; transition:opacity .3s; max-width:80vw; }
  #toast.show { opacity:1; }
  #pause { position:fixed; inset:0; background:rgba(10,11,14,.55); display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; text-align:center; }
  #pause[hidden], #touch[hidden] { display:none !important; }
  body.game #pause:not([hidden]) { display:flex !important; }
  #pause h2 { margin:0; }
  #touch { position:fixed; inset:0; pointer-events:none; }
  #touch button { pointer-events:auto; position:fixed; min-width:64px; min-height:56px; background:rgba(38,42,51,.7); }
  #touch button.on { background:var(--acc); color:#1a1405; border-color:var(--acc); }
  body.game { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #joy { position:fixed; width:110px; height:110px; margin:-55px 0 0 -55px; border:2px solid rgba(255,255,255,.3);
    border-radius:50%; display:none; pointer-events:none; }
  #joy div { position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; background:rgba(255,255,255,.35); }
</style>
</head>
<body class="preview">
<canvas id="gl"></canvas>
<div id="hint"></div>

<div id="top" class="preview-only">
  <label class="btn">Open video<input type="file" id="file" accept="video/*" hidden></label>
  <button id="demo">Demo</button>
  <span class="spacer"></span>
  <button id="enter" class="primary" disabled>Enter world ▶</button>
  <button id="togglePanel">Controls</button>
</div>
<div id="status" class="preview-only"></div>

<div id="panel" class="preview-only">
  <section id="srcSec" hidden>
    <h3>Source</h3>
    <video id="vid" controls playsinline muted preload="auto"></video>
    <div class="row">
      <button id="setStart">Set start</button>
      <button id="setEnd">Set end</button>
    </div>
    <div class="ctl"><label>Start (s)</label><input type="range" id="t0" min="0" max="1" step="0.01" value="0"><output id="t0o"></output></div>
    <div class="ctl"><label>End (s)</label><input type="range" id="t1" min="0" max="1" step="0.01" value="1"><output id="t1o"></output></div>
    <div class="ctl"><label>Frames</label><input type="range" id="frames" min="16" max="160" step="1" value="64"><output id="frameso"></output></div>
    <div class="ctl"><label>Width</label><input type="range" id="width" min="32" max="192" step="8" value="128"><output id="widtho"></output></div>
    <div id="mem" class="note"></div>
    <div class="row"><button id="build" class="primary">Build world</button></div>
    <progress id="prog" max="1" value="0" hidden></progress>
  </section>

  <section>
    <h3>Terrain</h3>
    <div class="segLabel">Rock is</div>
    <div class="seg" data-key="rock"><button data-v="bright">Bright</button><button data-v="dark">Dark</button><button data-v="still">Still</button></div>
    <div class="note" id="rockNote"></div>
    <div class="ctl"><label>Rock fill</label><input type="range" id="fill" min="30" max="90" step="1" value="60"><output id="fillo"></output></div>
    <div class="segLabel">Smoothing</div>
    <div class="seg" data-key="smooth"><button data-v="0">Off</button><button data-v="1">Some</button><button data-v="2">Lots</button></div>
    <div class="segLabel">Time runs</div>
    <div class="seg" data-key="axis"><button data-v="up">Upward (dig = rewind)</button><button data-v="fwd">Forward</button></div>
  </section>

  <section>
    <h3>Preview</h3>
    <div class="ctl"><label>Cut at frame</label><input type="range" id="cut" min="1" max="2" step="1" value="2"><output id="cuto"></output></div>
    <canvas id="sliceThumb" width="1" height="1"></canvas>
    <div class="row"><button id="xray">X-ray caves</button><button id="resetView">Reset view</button></div>
    <div class="note" id="caveInfo"></div>
    <div class="note">Tap or click the world to choose where you spawn. Cut away time to find spots inside.</div>
  </section>
</div>

<div id="hud" class="game-only">
  <canvas id="hudThumb" width="1" height="1"></canvas>
  <div class="big" id="hudTime"></div>
  <div id="hudCaves"></div>
  <div id="sense"><span id="senseText"></span><div id="senseBar"><div></div></div></div>
</div>
<div id="cross" class="game-only"></div>
<div id="help" class="game-only"></div>
<div id="swatch" class="game-only"></div>
<div id="toast"></div>
<div id="pause" class="game-only" hidden>
  <h2>Video Craft</h2>
  <div class="note">WASD move · Space jump · Mouse look<br>Left click dig · Right click place · F fly · L headlamp</div>
  <button id="resume" class="primary">Click to explore</button>
  <button id="toPreview">Back to preview</button>
</div>
<div id="touch" class="game-only" hidden>
  <div id="joy"><div></div></div>
  <button id="tJump" style="right:16px;bottom:calc(env(safe-area-inset-bottom) + 80px)">Jump</button>
  <button id="tDown" style="right:90px;bottom:calc(env(safe-area-inset-bottom) + 80px);display:none">Down</button>
  <button id="tAct" style="right:16px;bottom:calc(env(safe-area-inset-bottom) + 146px)">Dig</button>
  <button id="tFly" style="right:16px;top:calc(env(safe-area-inset-top) + 12px)">Fly</button>
  <button id="tLamp" style="right:90px;top:calc(env(safe-area-inset-top) + 12px)">Lamp</button>
  <button id="tMenu" style="right:164px;top:calc(env(safe-area-inset-top) + 12px)">Exit</button>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('gl');
const coarse = matchMedia('(pointer:coarse)').matches;
const CH = 16;                       // chunk edge in voxels
const MAXQ = CH * CH * CH * 3 + CH * CH * 4;   // worst-case quads per chunk (checkerboard + side walls); fits 16-bit indices
const BEDROCK = 0;                   // world layer y=0 is unbreakable bedrock

const settings = { rock: 'bright', smooth: 1, axis: 'up', fill: 60 };
let src = null;      // { w, h, d, frames:[Uint8ClampedArray], t0, t1, label, still? }
let W = null;        // world, see deriveWorld()
let mode = 'preview';
let gl, prog, U = {}, quadEBO, lineVAO, lineVBO, xrayVAO = null, xrayCount = 0;
let chunks = [];
let needsRender = false;

// ---------------------------------------------------------------- GL setup
const VS = `#version 300 es
layout(location=0) in vec3 aPos; layout(location=1) in vec4 aCol; layout(location=2) in vec4 aLit;
uniform mat4 uVP;
out vec3 vCol; out float vShade, vSky, vEmis; out vec3 vW;
void main() { vCol = aCol.rgb; vShade = aCol.a; vSky = aLit.x; vEmis = aLit.y; vW = aPos; gl_Position = uVP * vec4(aPos, 1.0); }`;
const FS = `#version 300 es
precision highp float;
in vec3 vCol; in float vShade, vSky, vEmis; in vec3 vW;
uniform vec3 uEye, uFog; uniform float uSun, uAmb, uLamp, uFogFar, uAlpha;
out vec4 o;
void main() {
  float d = distance(vW, uEye);
  vec3 c;
  if (vEmis > 0.5) c = vCol;
  else {
    float lamp = uLamp / (1.0 + 0.025 * d * d);
    c = vCol * vShade * min(vSky * uSun + uAmb + lamp, 1.35);
  }
  if (uFogFar > 0.0) c = mix(c, uFog, smoothstep(uFogFar * 0.55, uFogFar, d));
  o = vec4(c, uAlpha);
}`;

function compile(type, s) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, s); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
function initGL() {
  gl = canvas.getContext('webgl2', { antialias: true });
  if (!gl) { $('hint').textContent = 'WebGL2 is not available in this browser.'; return false; }
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  for (const n of ['uVP', 'uEye', 'uFog', 'uSun', 'uAmb', 'uLamp', 'uFogFar', 'uAlpha']) U[n] = gl.getUniformLocation(prog, n);
  // Shared index buffer: quads as (0,1,2)(0,2,3).
  const maxQuads = MAXQ, idx = new Uint16Array(maxQuads * 6);
  for (let q = 0; q < maxQuads; q++) idx.set([q * 4, q * 4 + 1, q * 4 + 2, q * 4, q * 4 + 2, q * 4 + 3], q * 6);
  quadEBO = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, quadEBO);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  lineVBO = gl.createBuffer();
  lineVAO = makeVAO(lineVBO, false);
  return true;
}
// Vertex layout (20 bytes): float32 x,y,z · unorm8 r,g,b,shade · unorm8 sky,emissive,-,-
function makeVAO(vbo, indexed) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.UNSIGNED_BYTE, true, 20, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.UNSIGNED_BYTE, true, 20, 16);
  if (indexed) gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, quadEBO);
  gl.bindVertexArray(null);
  return vao;
}

// ---------------------------------------------------------------- source → world
function luminance(f, p) { return 0.299 * f[p] + 0.587 * f[p + 1] + 0.114 * f[p + 2]; }

// Per-pixel "stillness": 255 minus the largest channel difference from the pixel's temporal median.
function stillness() {
  if (src.still) return src.still;
  const { w, h, d, frames } = src, N = w * h, hist = new Uint16Array(256), half = d / 2;
  const med = new Uint8Array(N * 3), out = new Float32Array(N * d);
  for (let i = 0; i < N; i++) for (let c = 0; c < 3; c++) {
    hist.fill(0);
    for (let f = 0; f < d; f++) hist[frames[f][i * 4 + c]]++;
    let s = 0, v = 0;
    for (; v < 256; v++) { s += hist[v]; if (s >= half) break; }
    med[i * 3 + c] = v;
  }
  for (let f = 0; f < d; f++) {
    const fr = frames[f];
    for (let i = 0; i < N; i++) {
      const p = i * 4, m = i * 3;
      const diff = Math.max(Math.abs(fr[p] - med[m]), Math.abs(fr[p + 1] - med[m + 1]), Math.abs(fr[p + 2] - med[m + 2]));
      out[f * N + i] = 255 - Math.min(255, diff * 2);
    }
  }
  return (src.still = out);
}

function boxBlur(a, w, h, d, r) {
  const tmp = new Float32Array(a.length);
  const pass = (from, to, n, stride, count, outerStride, outer2, outer2Stride) => {
    for (let o2 = 0; o2 < outer2; o2++) for (let o = 0; o < count; o++) {
      const base = o2 * outer2Stride + o * outerStride;
      for (let k = 0; k < n; k++) {
        let s = 0, c = 0;
        for (let j = Math.max(0, k - r); j <= Math.min(n - 1, k + r); j++) { s += from[base + j * stride]; c++; }
        to[base + k * stride] = s / c;
      }
    }
  };
  pass(a, tmp, w, 1, h, w, d, w * h);          // along x
  pass(tmp, a, h, w, w, 1, d, w * h);          // along y
  pass(a, tmp, d, w * h, w, 1, h, w);          // along time
  return tmp;
}

// Builds the voxel world from the extracted frames using the current terrain settings.
function deriveWorld() {
  const { w, h, d, frames } = src, N = w * h;
  let score = new Float32Array(N * d);
  if (settings.rock === 'still') score.set(stillness());
  else {
    const inv = settings.rock === 'dark';
    for (let f = 0; f < d; f++) {
      const fr = frames[f];
      for (let i = 0; i < N; i++) { const l = luminance(fr, i * 4); score[f * N + i] = inv ? 255 - l : l; }
    }
  }
  if (settings.smooth) score = boxBlur(score, w, h, d, settings.smooth);
  // Pick the threshold so that roughly `fill`% of voxels become rock, whatever the footage looks like.
  const hist = new Uint32Array(1024);
  for (let i = 0; i < score.length; i++) hist[Math.min(1023, score[i] * 4) | 0]++;
  let want = score.length * settings.fill / 100, acc = 0, b = 1023;
  for (; b > 0; b--) { acc += hist[b]; if (acc >= want) break; }
  const thr = b / 4;

  const up = settings.axis === 'up';
  const X = w, Y = 1 + (up ? d : h), Z = up ? h : d;
  const NV = X * Y * Z, solid = new Uint8Array(NV), col = new Uint8Array(NV * 3);
  for (let y = 0; y < Y; y++) for (let z = 0; z < Z; z++) for (let x = 0; x < X; x++) {
    const i = x + X * (z + Z * y);
    if (y === BEDROCK) {
      solid[i] = 1;
      const g = ((x + z) & 1) ? 46 : 38;
      col[i * 3] = g; col[i * 3 + 1] = g; col[i * 3 + 2] = g + 6;
      continue;
    }
    const f = up ? y - 1 : z, r = up ? z : h - y;
    const v = r * w + x;
    solid[i] = score[f * N + v] >= thr ? 1 : 0;
    const fr = frames[f];
    col[i * 3] = fr[v * 4]; col[i * 3 + 1] = fr[v * 4 + 1]; col[i * 3 + 2] = fr[v * 4 + 2];
  }
  W = { X, Y, Z, solid, col, up, top: new Int16Array(X * Z), clipPos: Infinity,
        ncx: Math.ceil(X / CH), ncy: Math.ceil(Y / CH), ncz: Math.ceil(Z / CH), spawn: null };
  for (let z = 0; z < Z; z++) for (let x = 0; x < X; x++) updateTop(x, z);
  findCaves();
  W.spawn = defaultSpawn();
}

// Frame index for a world cell, and the frame's time in seconds.
function frameAt(y, z) { return Math.max(0, Math.min(src.d - 1, W.up ? y - 1 : z)); }
function frameTime(f) { return src.t0 + (src.t1 - src.t0) * f / Math.max(1, src.d - 1); }
function timeAxisCoord(y, z) { return W.up ? y : z; }   // world coordinate that runs along time

function idx(x, y, z) { return x + W.X * (z + W.Z * y); }
function inside(x, y, z) { return x >= 0 && y >= 0 && z >= 0 && x < W.X && y < W.Y && z < W.Z; }
// Solid test for rendering and picking: out of bounds is air, and the preview cut removes later frames.
function solidV(x, y, z) {
  if (!inside(x, y, z)) return 0;
  if (y > BEDROCK && timeAxisCoord(y, z) >= W.clipPos) return 0;
  return W.solid[idx(x, y, z)];
}
// Solid test for the player: the world's sides and floor are walls, the sky is open.
function solidP(x, y, z) {
  if (y >= W.Y) return 0;
  if (x < 0 || z < 0 || y < 0 || x >= W.X || z >= W.Z) return 1;
  return W.solid[idx(x, y, z)];
}
function updateTop(x, z) {
  let y = W.Y - 1;
  while (y >= 0 && !W.solid[idx(x, y, z)]) y--;
  const old = W.top[x + W.X * z];
  W.top[x + W.X * z] = y + 1;
  return old !== y + 1;
}

// A cave is a pocket of air that can't be reached from the sky: something that appeared and vanished
// within the clip. Labels are computed once per build; digging into one "discovers" it.
function findCaves() {
  const { X, Y, Z, solid } = W, NV = X * Y * Z;
  const lab = new Int32Array(NV).fill(-2);    // -2 unvisited, -1 open air or tiny pocket, >=0 cave id
  const q = new Int32Array(NV);
  const XZ = X * Z;
  const flood = (start, id) => {
    let head = 0, tail = 0;
    q[tail++] = start; lab[start] = id;
    while (head < tail) {
      const i = q[head++], x = i % X, z = ((i / X) | 0) % Z, y = (i / XZ) | 0;
      const tryN = j => { if (lab[j] === -2 && !solid[j]) { lab[j] = id; q[tail++] = j; } };
      if (x > 0) tryN(i - 1); if (x < X - 1) tryN(i + 1);
      if (z > 0) tryN(i - X); if (z < Z - 1) tryN(i + X);
      if (y > 0) tryN(i - XZ); if (y < Y - 1) tryN(i + XZ);
    }
    return tail;
  };
  // Everything connected to the top layer is open sky. In "forward" mode that's the top of every frame.
  for (let i = (Y - 1) * XZ; i < NV; i++) if (!solid[i] && lab[i] === -2) flood(i, -1);
  const caves = [];

// Glowing outlines of every hidden cave, drawn through the terrain.
function buildXray() {

// ---------------------------------------------------------------- cameras & rendering
const orbit = { yaw: 0.7, pitch: 0.55, dist: 200 };
const P = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, yaw: 0, pitch: -0.2, onGround: false, fly: false, lamp: true, step: 0,
  held: [200, 200, 200], placeMode: false };
const EYE = 1.55, HALF = 0.3, TALL = 1.75;

// In game, the render scale drops on slow devices (see tick) but never below one pixel per CSS pixel.
let renderScale = 1;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2) * (mode === 'game' ? renderScale : 1);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

// NDC offset of the visible area's centre when the controls panel covers part of the screen.

function render() {

  const fog = game ? [0.62, 0.78, 0.95] : [0.06, 0.063, 0.08];
  gl.clearColor(fog[0], fog[1], fog[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.useProgram(prog);
  gl.uniformMatrix4fv(U.uVP, false, cam.vp);

// ---------------------------------------------------------------- frame capture
async function buildFromSource(w, h, d, drawFrame, meta) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const frames = [];
  $('prog').hidden = false;
  for (let f = 0; f < d; f++) {
    await drawFrame(ctx, f);
    frames.push(ctx.getImageData(0, 0, w, h).data);
    $('prog').value = (f + 1) / d;
    setStatus(`Extracting frame ${f + 1} / ${d}`);
  }
  $('prog').hidden = true;
  src = { w, h, d, frames, ...meta };
  await regenerate(true);
}

async function regenerate(resetView) {
  if (!src) return;
  setStatus('Shaping terrain…');
  await new Promise(r => setTimeout(r, 0));
  deriveWorld();
  setupCut();
  remeshAll();
  buildXray();
  if (resetView) { orbit.yaw = 0.7; orbit.pitch = 0.55; orbit.dist = fitDistance(); }
  const n = W.caves.length, big = n ? Math.max(...W.caves.map(c => c.size)) : 0;
  $('caveInfo').textContent = n ? `${n} sealed cave${n > 1 ? 's' : ''} hidden inside · largest ${big} blocks` : 'No sealed caves. Try more rock fill or a different "Rock is".';
  setStatus(`${src.label} · ${W.X}×${W.Z} blocks, ${W.Y - 1} layers deep`);
  $('enter').disabled = false;
  $('hint').textContent = '';
  requestRender();
}

function demoDraw() {
  const w = 128, h = 72, d = 72;
  // Two drifting layers of soft noise give rolling terrain and winding tunnels.
  const noise = document.createElement('canvas'); noise.width = 64; noise.height = 36;
  const nctx = noise.getContext('2d'), img = nctx.createImageData(64, 36);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 64 * 36; i++) { const v = 90 + rnd() * 165; img.data.set([v, v * 0.92, v * 0.75, 255], i * 4); }
  nctx.putImageData(img, 0, 0);
  const geodes = [];   // dark bubbles with a bright rim that appear and vanish mid-clip → sealed caves
  for (let k = 0; k < 9; k++) geodes.push({ x: 12 + rnd() * 104, y: 10 + rnd() * 52, a: 0.1 + rnd() * 0.5, len: 0.15 + rnd() * 0.25, R: 4 + rnd() * 6,
    rim: ['#7df9ff', '#ff7af5', '#b6ff6b', '#ffe66b'][k % 4], dx: (rnd() - 0.5) * 30, dy: (rnd() - 0.5) * 16 });

    const t = f / (d - 1);
    ctx.imageSmoothingEnabled = true;

    ctx.globalAlpha = 1; ctx.drawImage(noise, -20 + t * 24, -6, w + 40, h + 12);
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.85;
    ctx.save(); ctx.translate(w / 2, h / 2); ctx.rotate(1.2 + t * 0.4); ctx.drawImage(noise, -w * 0.9, -h * 0.9, w * 1.8, h * 1.8); ctx.restore();
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    // grass on the final frames so the surface looks like a meadow
    if (t > 0.9) { ctx.globalAlpha = (t - 0.9) * 8; ctx.fillStyle = '#5c9e3c'; ctx.fillRect(0, 0, w, h); ctx.globalAlpha = 1; ctx.drawImage(noise, -20 + t * 24, -6, w + 40, h + 12); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#6fbf4a'; ctx.fillRect(0, 0, w, h); ctx.globalCompositeOperation = 'source-over'; }
    // a dark creature worming across the whole clip leaves a tunnel open at both ends
    const wx = -10 + t * 150, wy = 36 + Math.sin(t * 9) * 18;

  if (mode !== 'game') return;
  keys[e.code] = true;
  if (e.code === 'KeyF') { P.fly = !P.fly; toast(P.fly ? 'Flying (Space up, Shift down)' : 'Walking', 1200); }
  if (e.code === 'KeyL') { P.lamp = !P.lamp; toast(P.lamp ? 'Headlamp on' : 'Headlamp off', 1000); }
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
canvas.addEventListener('mousedown', e => {
  if (mode !== 'game' || coarse) return;
  if (document.pointerLockElement !== canvas) { canvas.requestPointerLock(); return; }
  actQueued = e.button === 2 || e.shiftKey && e.button === 0 ? true : e.button === 0 ? false : null;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => {
  if (mode !== 'game' || document.pointerLockElement !== canvas) return;
  P.yaw -= e.movementX * 0.0024;
  P.pitch = Math.max(-1.55, Math.min(1.55, P.pitch - e.movementY * 0.0024));
});

// touch input: left third is a joystick, the rest drags to look and taps to act
const touchHeld = { jump: false, down: false };
canvas.addEventListener('touchstart', e => {
  if (mode !== 'game') return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth * 0.38 && joy.id === null) {
      Object.assign(joy, { id: t.identifier, ox: t.clientX, oy: t.clientY, x: 0, y: 0 });
      const j = $('joy'); j.style.display = 'block'; j.style.left = t.clientX + 'px'; j.style.top = t.clientY + 'px';
      j.firstElementChild.style.transform = '';
    } else if (!look) look = { id: t.identifier, x: t.clientX, y: t.clientY, sx: t.clientX, sy: t.clientY, t: performance.now() };
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (mode !== 'game') return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      let dx = (t.clientX - joy.ox) / 45, dy = (t.clientY - joy.oy) / 45;
      const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
      joy.x = dx; joy.y = dy;
      $('joy').firstElementChild.style.transform = `translate(${dx * 33}px,${dy * 33}px)`;
    } else if (look && t.identifier === look.id) {
      if (Math.hypot(t.clientX - look.sx, t.clientY - look.sy) > 10) look.moved = true;
      P.yaw -= (t.clientX - look.x) * 0.006;
      P.pitch = Math.max(-1.55, Math.min(1.55, P.pitch - (t.clientY - look.y) * 0.006));
      look.x = t.clientX; look.y = t.clientY;
    }
  }
}, { passive: false });
function resetInput() {
  for (const k in keys) keys[k] = false;
  touchHeld.jump = touchHeld.down = false;
  joy.id = null; joy.x = joy.y = 0; $('joy').style.display = 'none';
  look = null;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) resetInput(); else worldDirty = true; });
const touchEnd = e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) { joy.id = null; joy.x = joy.y = 0; $('joy').style.display = 'none'; }
    else if (look && t.identifier === look.id) {
      if (!look.moved && !look.held && performance.now() - look.t < 380) actQueued = P.placeMode;
      look = null;
    }
  }
};
canvas.addEventListener('touchend', touchEnd);
canvas.addEventListener('touchcancel', touchEnd);
const hold = (id, k) => {
  $(id).addEventListener('touchstart', e => { e.preventDefault(); touchHeld[k] = true; }, { passive: false });
  $(id).addEventListener('touchend', () => { touchHeld[k] = false; });
  $(id).addEventListener('touchcancel', () => { touchHeld[k] = false; });
};
hold('tJump', 'jump'); hold('tDown', 'down');
$('tAct').onclick = () => { P.placeMode = !P.placeMode; $('tAct').textContent = P.placeMode ? 'Place' : 'Dig'; $('tAct').classList.toggle('on', P.placeMode); };
$('tFly').onclick = () => { P.fly = !P.fly; $('tFly').classList.toggle('on', P.fly); $('tDown').style.display = P.fly ? '' : 'none'; $('tJump').textContent = P.fly ? 'Up' : 'Jump'; };
$('tLamp').onclick = () => { P.lamp = !P.lamp; $('tLamp').classList.toggle('on', P.lamp); };
$('tLamp').classList.add('on');
$('tMenu').onclick = exitGame;

// ---------------------------------------------------------------- start
addEventListener('resize', () => { if (mode === 'preview') requestRender(); });
canvas.addEventListener('webglcontextlost', e => e.preventDefault());
canvas.addEventListener('webglcontextrestored', () => {
  chunks = []; xrayVAO = null; xrayCount = 0;
  initGL();
  if (W) { remeshAll(); buildXray(); }
  worldDirty = true;
  requestRender();
});
syncSegs();
if (initGL()) { $('hint').textContent = 'Building demo world…'; loadDemo(); }
</script>
</body>
